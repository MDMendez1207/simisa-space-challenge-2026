name: Bug report
description: Report a reproducible problem in the SIMISA prototype
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome 140, Windows 11, 1440×900
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots without personal or health information.
